<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="dsh-remote-ssh-plugin-diagram-title">
  <title id="dsh-remote-ssh-plugin-diagram-title">dsh-remote-ssh-plugin architecture: a local DeepSeek Harness session manages SSH machines and remote workspaces, and talks to a Linux host over an encrypted SSH channel to run commands and edit files through the remote tools.</title>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- panel -->
    <rect x="16" y="16" width="928" height="508" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- heading -->
    <text x="48" y="66" font-size="21" font-weight="700" fill="#0F172A">dsh-remote-ssh-plugin</text>
    <text x="48" y="92" font-size="13.5" fill="#475569">SSH remote development for DeepSeek Harness — manage machines in Settings, browse remote directories, work in remote workspaces</text>

    <!-- local machine block -->
    <rect x="48" y="118" width="252" height="256" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="72" y="140" width="26" height="18" rx="3" fill="none" stroke="#4F46E5" stroke-width="1.8"/>
    <rect x="76" y="158" width="18" height="4" rx="2" fill="#4F46E5"/>
    <text x="110" y="155" font-size="16" font-weight="700" fill="#0F172A">Local Mac</text>
    <text x="72" y="184" font-size="12" fill="#64748B">DeepSeek Harness Desktop / Web</text>
    <line x1="72" y1="198" x2="276" y2="198" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="72" y="224" font-size="12.5" font-weight="600" fill="#334155">Settings panel</text>
    <text x="72" y="244" font-size="12" fill="#475569">add / test SSH machines</text>
    <text x="72" y="272" font-size="12.5" font-weight="600" fill="#334155">Remote workspaces</text>
    <text x="72" y="292" font-size="12" fill="#475569">SSH · machine · directory</text>
    <text x="72" y="320" font-size="12.5" font-weight="600" fill="#334155">Agent tools</text>
    <text x="72" y="340" font-size="12" fill="#475569">remote_exec / read / write …</text>
    <text x="72" y="362" font-size="11.5" fill="#94A3B8">local bash &amp; file tools stay here</text>

    <!-- channel -->
    <text x="330" y="196" font-size="12.5" font-weight="600" fill="#4338CA">encrypted SSH channel</text>
    <text x="330" y="214" font-size="11" fill="#6366F1">multiplexed · ControlMaster</text>
    <line x1="300" y1="236" x2="380" y2="236" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M374 230 l8 6 -8 6" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="388" y="240" font-size="11" fill="#475569">commands, file edits</text>
    <line x1="300" y1="272" x2="380" y2="272" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M306 266 l-8 6 8 6" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="388" y="276" font-size="11" fill="#475569">stdout, file contents</text>
    <!-- lock -->
    <rect x="316" y="300" width="26" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
    <path d="M322 300 v-7 a7 7 0 0 1 14 0 v7" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <circle cx="329" cy="309" r="2.6" fill="#4F46E5"/>
    <text x="352" y="315" font-size="11.5" fill="#4338CA">key-based login</text>
    <text x="352" y="332" font-size="11.5" fill="#4338CA">no TTY · bounded output</text>

    <!-- remote host block -->
    <rect x="662" y="118" width="252" height="256" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="686" y="140" width="26" height="8" rx="2" fill="none" stroke="#059669" stroke-width="1.8"/>
    <rect x="686" y="152" width="26" height="8" rx="2" fill="none" stroke="#059669" stroke-width="1.8"/>
    <circle cx="718" cy="144" r="2.4" fill="#059669"/>
    <circle cx="718" cy="156" r="2.4" fill="#059669"/>
    <text x="734" y="155" font-size="16" font-weight="700" fill="#0F172A">Remote host · Linux</text>
    <text x="686" y="184" font-size="12" fill="#64748B">your SSH user</text>
    <line x1="686" y1="198" x2="890" y2="198" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="686" y="224" font-size="12.5" font-weight="600" fill="#334155">Workspace directory</text>
    <text x="686" y="244" font-size="12" fill="#475569">e.g. /srv/app</text>
    <text x="686" y="272" font-size="12.5" font-weight="600" fill="#334155">Commands &amp; builds</text>
    <text x="686" y="292" font-size="12" fill="#475569">npm test · make · git</text>
    <text x="686" y="320" font-size="12.5" font-weight="600" fill="#334155">Files</text>
    <text x="686" y="340" font-size="12" fill="#475569">edit, search, upload / download</text>
    <text x="686" y="362" font-size="11.5" fill="#059669">node · npm · git · python3</text>

    <!-- flow band -->
    <rect x="48" y="398" width="866" height="102" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="72" y="427" font-size="13" font-weight="700" fill="#3730A3">How it works</text>
    <text x="72" y="452" font-size="12" fill="#1E293B">1. Add an SSH machine</text>
    <text x="270" y="452" font-size="12" fill="#1E293B">2. Browse and choose a remote directory</text>
    <text x="562" y="452" font-size="12" fill="#1E293B">3. Workspace “SSH · machine · path”</text>
    <text x="72" y="478" font-size="12" fill="#1E293B">4. New session in that workspace → the agent uses remote_* tools there</text>
    <path d="M246 447 l12 0" stroke="#6366F1" stroke-width="1.8"/>
    <path d="M252 443 l6 4 -6 4" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M534 447 l12 0" stroke="#6366F1" stroke-width="1.8"/>
    <path d="M540 443 l6 4 -6 4" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M834 447 l12 0" stroke="#6366F1" stroke-width="1.8"/>
    <path d="M840 443 l6 4 -6 4" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="858" y="452" font-size="12" fill="#1E293B">remote</text>
  </g>
</svg>
